[package]
name = "swiss"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Swivelgames/Swiss"
publish = ["crates-io"]
description = "Cooperative file and directory claims"
keywords = ["file-claims", "agent-coordination", "filesystem", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
exclude = ["/.github/social-preview.jpg"]

[dependencies]
atomicwrites = "0.4"
clap = { version = "4", default-features = false, features = ["std"] }
clap_lex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
trine = "0.0.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
linux-raw-sys = { version = "0.12", features = ["general"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
