[package]
name = "sniff"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Swivelgames/Sniff"
publish = false
description = "Cooperative file and directory claims"

[dependencies]
atomicwrites = "0.4"
clap = { version = "4", default-features = false, features = ["std"] }
clap_lex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
trine = "=0.0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
linux-raw-sys = { version = "0.12", features = ["general"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
